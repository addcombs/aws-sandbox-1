spring.application.name=aws-sandbox-1
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password: ${DB_PASSWORD}
spring.datasource.hikari.data-source-properties.sslmode=${DB_SSLMODE:verify-full}
spring.datasource.hikari.data-source-properties.connectTimeout=10
spring.datasource.hikari.data-source-properties.socketTimeout=10
spring.datasource.hikari.connection-timeout=10000
spring.sql.init.mode=never

server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
